name: Security - secrets

# Runs on every PR (no paths filter) because a secret can leak from any file,
# and because "Secret detection" is a required check.
on:
  pull_request:
    branches: [main, base/00-starter]
  push:
    branches: [main, base/00-starter]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Gitleaks must see every commit: a secret removed in a later commit
          # is still exposed in the history.
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan Git history
        run: |
          mkdir -p reports
          gitleaks git . --redact --verbose \
            --report-format sarif --report-path reports/gitleaks.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: reports/
          retention-days: 7
          if-no-files-found: warn
