name: CI - pricing-service

on:
  # No `paths` filter on pull_request: required checks must exist on every PR,
  # otherwise a PR that only touches the other service would stay blocked
  # waiting for a check that never runs.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'apps/pricing-service/**'
      - '.github/workflows/ci-pricing.yml'

# Least privilege by default; the image job asks for more only where needed.
permissions:
  contents: read

# A new push on the same branch cancels the obsolete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pricing-service
  PYTHON_VERSION: '3.12'

defaults:
  run:
    working-directory: apps/pricing-service

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/pricing-service/requirements.txt
            apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run unit and HTTP tests
        run: |
          mkdir -p build/test-results
          python -m pytest --junitxml=build/test-results/pytest.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: apps/pricing-service/build/test-results/
          retention-days: 7
          if-no-files-found: warn

  quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/pricing-service/requirements.txt
            apps/pricing-service/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff lint
        run: python -m ruff check app tests --output-format=github

      - name: Ruff format
        run: python -m ruff format --check --diff app tests

      - name: Write Ruff report
        if: always()
        run: |
          mkdir -p build/reports/ruff
          python -m ruff check app tests --exit-zero \
            --output-format=junit --output-file build/reports/ruff/ruff.xml

      - name: Upload Ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-ruff-report
          path: apps/pricing-service/build/reports/ruff/
          retention-days: 7
          if-no-files-found: warn

  image:
    name: Python Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [tests, quality]
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      # Images are only published after integration on main, never from a PR.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: apps/pricing-service
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pricing-service
          cache-to: type=gha,mode=max,scope=pricing-service

      - name: Scan image with Trivy
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security
        if: env.PUBLISH == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-pricing
